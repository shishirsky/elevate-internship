<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="top">
        <div class="box">

            <!-- Logo Image -->
            <div class="logo">
                <img src="elevate.jpeg" alt="Logo">
            </div>

            <!-- Menu -->
            <nav>
                <ul class="menu">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Service</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <!-- Main Section -->
    <section class="main">
        <div class="text">
            <h1>Welcome To My Website</h1>

            <p>
                This is a simple responsive landing page made using
                HTML and CSS. It works on mobile and desktop screen.
            </p>

            <a href="#" class="button">Get Started</a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bottom">
        <p>2026 My Website | All Rights Reserved</p>

        <div class="links">
            <a href="#">Instagram</a>
            <a href="#">GitHub</a>
            <a href="#">LinkedIn</a>
        </div>
    </footer>

</body>
</html>
